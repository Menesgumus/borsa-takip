[project]
name = "borsa-takip-backend"
version = "0.1.0"
description = "Borsa Takip Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "redis>=5.1.1",
    "argon2-cffi>=25.1.0",
    "openai>=3.8.0",
    "httpx>=0.28.1",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"migrations/**" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "httpx>=0.27.2",
    "respx>=0.23.1",
]

