name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fake_password
          POSTGRES_DB: borsa_takip_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d borsa_takip_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      working-directory: ./backend
      run: uv sync --frozen
    - name: Lint and Test
      working-directory: ./backend
      run: |
        uv run ruff check .
        uv run mypy .
        uv run pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pnpm
      run: corepack enable pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint and Typecheck
      working-directory: ./frontend
      run: |
        pnpm lint
        pnpm typecheck
    - name: Unit Tests
      working-directory: ./frontend
      run: pnpm test:unit
    - name: Production Build
      working-directory: ./frontend
      run: pnpm build

  security-scans:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install Dependencies
      working-directory: ./backend
      run: uv sync --frozen
    - name: Backend Bandit
      working-directory: ./backend
      run: uv run bandit -c pyproject.toml -r app/
    - name: Backend pip-audit
      working-directory: ./backend
      run: uv run pip-audit
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install pnpm
      run: corepack enable pnpm
    - name: Frontend Audit
      working-directory: ./frontend
      run: pnpm audit --audit-level high
